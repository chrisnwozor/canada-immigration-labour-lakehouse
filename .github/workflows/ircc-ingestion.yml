name: IRCC API Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download IRCC JSON
        run: |
          curl --fail --location --show-error \
            "https://www.canada.ca/content/dam/ircc/documents/json/ee_rounds_123_en.json" \
            --output ircc_draws.json

      - name: Validate JSON
        run: |
          jq -e '.rounds | type == "array" and length > 0' ircc_draws.json

      - name: Upload JSON to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILE_PATH="/Volumes/canada_intelligence/bronze/landing/ircc_express_entry/ircc_${TIMESTAMP}_${GITHUB_RUN_ID}.json"

          curl --fail-with-body --show-error \
            --request PUT \
            --header "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @ircc_draws.json \
            "${DATABRICKS_HOST%/}/api/2.0/fs/files${FILE_PATH}?overwrite=false"

          echo "Uploaded: ${FILE_PATH}"
